<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fullEmeraldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#20C982" />
      <stop offset="60%" stop-color="#16A36A" />
      <stop offset="100%" stop-color="#11794E" />
    </linearGradient>

    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#16A36A" flood-opacity="0.35" />
    </filter>

    <filter id="fullLineShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#07130E" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (88x88, centered around (60, 60)) -->
  <g filter="url(#fullGlow)">
    <rect x="24" y="46" width="72" height="28" rx="9" fill="url(#fullEmeraldGrad)" />
    <rect x="46" y="24" width="28" height="72" rx="9" fill="url(#fullEmeraldGrad)" />
  </g>

  <!-- Integrated White ECG Waveform in Icon -->
  <path
    d="M 27 60 L 45 60 L 50 64 L 58 38 L 66 82 L 72 56 Q 77 54 81 60 L 93 60"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#fullLineShadow)"
  />
  <circle cx="27" cy="60" r="1.5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="93" cy="60" r="1.5" fill="#FFFFFF" opacity="0.9" />

  <!-- Wordmark Text: "MediTrack" -->
  <g transform="translate(116, 68)">
    <text
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif"
      font-size="44"
      font-weight="600"
      letter-spacing="-0.03em"
      fill="#FFFFFF"
    >Medi<tspan fill="#20C982" font-weight="700">Track</tspan></text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(118, 92)">
    <text
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif"
      font-size="11"
      font-weight="700"
      letter-spacing="0.18em"
      fill="#A7B7AC"
    >SMART MEDICINE REMINDER</text>
  </g>
</svg>
